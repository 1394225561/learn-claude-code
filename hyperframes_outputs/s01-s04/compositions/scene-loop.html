<template id="scene-loop-template">
  <div data-composition-id="scene-loop" data-width="1920" data-height="1080" data-duration="17">
    <div class="canvas">
      <div class="dot-grid"></div>
      <div class="glow glow-red"></div>

      <div class="section-label">
        <span class="label-id">01 · Agent Loop</span><span class="label-phrase">一个循环就够了</span>
        <div class="label-fx">
          <div class="label-glow"></div>
          <div class="label-dot dot-1"></div>
          <div class="label-dot dot-2"></div>
          <div class="label-dot dot-3"></div>
          <div class="label-dot dot-4"></div>
          <div class="label-dot dot-5"></div>
          <div class="label-dot dot-6"></div>
        </div>
      </div>
      <div class="scene-title">最小可运行的 Agent，不到 30 行。</div>

      <!-- Code block -->
      <div class="code-block">
        <div class="code-lines" id="loop-code">
          <div class="code-line" data-line="1"><span class="ln">1</span><span class="kw">def</span> <span class="fn">agent_loop</span>(messages):</div>
          <div class="code-line hl" data-line="2"><span class="ln">2</span>    <span class="kw">while</span> <span class="kc">True</span>:</div>
          <div class="code-line" data-line="3"><span class="ln">3</span>        response = client.messages.create(</div>
          <div class="code-line" data-line="4"><span class="ln">4</span>            model=MODEL, messages=messages, tools=TOOLS)</div>
          <div class="code-line" data-line="5"><span class="ln">5</span>        messages.append({<span class="st">"role"</span>: <span class="st">"assistant"</span>, <span class="st">"content"</span>: response.content})</div>
          <div class="code-line" data-line="6"><span class="ln">6</span></div>
          <div class="code-line hl" data-line="7"><span class="ln">7</span>        <span class="kw">if</span> response.stop_reason != <span class="st">"tool_use"</span>:</div>
          <div class="code-line hl" data-line="8"><span class="ln">8</span>            <span class="kw">return</span></div>
          <div class="code-line" data-line="9"><span class="ln">9</span></div>
          <div class="code-line" data-line="10"><span class="ln">10</span>        results = []</div>
          <div class="code-line" data-line="11"><span class="ln">11</span>        <span class="kw">for</span> block <span class="kw">in</span> response.content:</div>
          <div class="code-line" data-line="12"><span class="ln">12</span>            <span class="kw">if</span> block.type == <span class="st">"tool_use"</span>:</div>
          <div class="code-line" data-line="13"><span class="ln">13</span>                output = <span class="fn">run_bash</span>(block.input[<span class="st">"command"</span>])</div>
          <div class="code-line" data-line="14"><span class="ln">14</span>                results.append({<span class="st">"type"</span>: <span class="st">"tool_result"</span>, ...})</div>
          <div class="code-line" data-line="15"><span class="ln">15</span>        messages.append({<span class="st">"role"</span>: <span class="st">"user"</span>, <span class="st">"content"</span>: results})</div>
        </div>
        <!-- Highlight band on the key lines -->
        <div class="hl-band" id="hl-loop"></div>
      </div>

      <!-- Signal card -->
      <div class="signal-card" id="signal-card">
        <div class="signal-row">
          <span class="signal-badge signal-continue">tool_use</span>
          <span class="signal-desc">→ 执行工具，结果喂回，继续循环</span>
        </div>
        <div class="signal-row">
          <span class="signal-badge signal-stop">end_turn</span>
          <span class="signal-desc">→ 退出循环，任务完成</span>
        </div>
      </div>

      <!-- Insight -->
      <div class="insight-card" id="insight-loop">
        <div class="insight-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F24E1E" stroke-width="2.5" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>
        </div>
        <div class="insight-text">模型决策，Harness 执行。后续所有机制都在这个循环上叠加，循环本身始终不变。</div>
      </div>

      <div class="accent-rule"></div>
    </div>

    <style>
      [data-composition-id="scene-loop"] {
        width: 1920px; height: 1080px;
        position: absolute; overflow: hidden;
        background: #0a0a0f; color: white;
        font-family: "Inter", sans-serif;
      }
      [data-composition-id="scene-loop"] .canvas { position: absolute; inset: 0; }
      [data-composition-id="scene-loop"] .dot-grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      [data-composition-id="scene-loop"] .glow {
        position: absolute; border-radius: 50%; pointer-events: none;
        filter: blur(120px); opacity: 0;
      }
      [data-composition-id="scene-loop"] .glow-red {
        width: 500px; height: 500px; background: #F24E1E;
        left: 100px; top: 300px;
      }
      [data-composition-id="scene-loop"] .section-label {
        position: absolute; top: 50px; left: 80px;
        display: flex; align-items: center; gap: 16px;
        opacity: 0;
      }
      [data-composition-id="scene-loop"] .label-id {
        font-family: "JetBrains Mono", monospace;
        font-size: 18px; font-weight: 600; color: #F24E1E;
        text-transform: uppercase; letter-spacing: 0.15em;
      }
      [data-composition-id="scene-loop"] .label-phrase {
        font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85);
        letter-spacing: 0.02em;
        opacity: 0; transform: translateX(-10px);
      }
      [data-composition-id="scene-loop"] .label-fx {
        position: absolute; left: 120px; top: 50%;
        width: 0; height: 0; pointer-events: none;
      }
      [data-composition-id="scene-loop"] .label-glow {
        position: absolute; width: 260px; height: 50px;
        left: -130px; top: -25px; border-radius: 25px;
        background: radial-gradient(ellipse, rgba(242,78,30,0.15) 0%, transparent 70%);
        opacity: 0;
      }
      [data-composition-id="scene-loop"] .label-dot {
        position: absolute; width: 5px; height: 5px;
        border-radius: 50%; background: #F24E1E;
        box-shadow: 0 0 8px rgba(242,78,30,0.6);
        opacity: 0;
      }
      [data-composition-id="scene-loop"] .scene-title {
        position: absolute; top: 85px; left: 80px;
        font-size: 32px; font-weight: 700; color: rgba(255,255,255,0.9);
        opacity: 0; transform: translateY(10px);
      }
      /* Code block */
      [data-composition-id="scene-loop"] .code-block {
        position: absolute; left: 80px; top: 160px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 16px; padding: 32px 40px;
        min-width: 1000px;
      }
      [data-composition-id="scene-loop"] .code-lines {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px; line-height: 1.8;
      }
      [data-composition-id="scene-loop"] .code-line {
        opacity: 0; transform: translateX(-10px);
        padding: 2px 8px; border-radius: 4px;
        white-space: nowrap;
      }
      [data-composition-id="scene-loop"] .code-line.hl {
        background: rgba(242,78,30,0.08);
        border-left: 3px solid #F24E1E;
        padding-left: 5px;
      }
      [data-composition-id="scene-loop"] .ln {
        display: inline-block; width: 40px;
        color: rgba(255,255,255,0.15); font-size: 16px;
        text-align: right; margin-right: 16px;
        user-select: none;
      }
      [data-composition-id="scene-loop"] .kw { color: #C586C0; }
      [data-composition-id="scene-loop"] .fn { color: #DCDCAA; }
      [data-composition-id="scene-loop"] .kc { color: #569CD6; }
      [data-composition-id="scene-loop"] .st { color: #CE9178; }
      /* Signal card */
      [data-composition-id="scene-loop"] .signal-card {
        position: absolute; right: 80px; top: 200px;
        display: flex; flex-direction: column; gap: 20px;
        opacity: 0; transform: translateX(20px);
      }
      [data-composition-id="scene-loop"] .signal-row {
        display: flex; align-items: center; gap: 20px;
        padding: 22px 28px; border-radius: 14px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
      }
      [data-composition-id="scene-loop"] .signal-badge {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px; font-weight: 600;
        padding: 8px 18px; border-radius: 10px;
        white-space: nowrap;
      }
      [data-composition-id="scene-loop"] .signal-continue {
        background: rgba(10,207,131,0.1); color: #0ACF83;
        border: 1px solid rgba(10,207,131,0.25);
      }
      [data-composition-id="scene-loop"] .signal-stop {
        background: rgba(242,78,30,0.1); color: #F24E1E;
        border: 1px solid rgba(242,78,30,0.25);
      }
      [data-composition-id="scene-loop"] .signal-desc {
        font-size: 22px; color: rgba(255,255,255,0.55);
      }
      /* Highlight band */
      [data-composition-id="scene-loop"] .hl-band {
        position: absolute; left: 0; right: 0;
        height: 0; background: rgba(242,78,30,0.04);
        border-radius: 8px; pointer-events: none;
        opacity: 0;
      }
      /* Insight */
      [data-composition-id="scene-loop"] .insight-card {
        position: absolute; left: 80px; bottom: 90px;
        display: flex; align-items: center; gap: 16px;
        padding: 20px 28px; border-radius: 14px;
        background: rgba(242,78,30,0.04);
        border: 1px solid rgba(242,78,30,0.15);
        opacity: 0; transform: translateY(10px);
      }
      [data-composition-id="scene-loop"] .insight-icon {
        width: 40px; height: 40px; border-radius: 10px;
        background: rgba(242,78,30,0.08); display: grid; place-items: center;
        flex-shrink: 0;
      }
      [data-composition-id="scene-loop"] .insight-text {
        font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.7);
        max-width: 800px;
      }
      [data-composition-id="scene-loop"] .accent-rule {
        position: absolute; bottom: 50px; left: 80px; right: 80px;
        height: 1px; background: rgba(255,255,255,0.06);
        transform: scaleX(0); transform-origin: left;
      }
    </style>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var sel = '[data-composition-id="scene-loop"]';

        tl.to(sel + ' .glow-red', { opacity: 0.08, duration: 1, ease: "power2.out" }, 0);
        tl.to(sel + ' .section-label', { opacity: 1, duration: 0.2 }, 0);
        tl.to(sel + ' .label-id', { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
        tl.fromTo(sel + ' .label-phrase', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(2)" }, 0.3);
        tl.to(sel + ' .scene-title', { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);

        // Label particle ring
        tl.to(sel + ' .label-glow', { opacity: 1, duration: 0.6 }, 0.5);
        tl.to(sel + ' .label-dot', { opacity: 0.9, duration: 0.3, stagger: 0.08 }, 0.6);
        var orbitTl = gsap.timeline({ repeat: 4 });
        var dots = document.querySelectorAll(sel + ' .label-dot');
        var radii = [30, 40, 50, 35, 45, 38];
        dots.forEach(function (dot, i) {
          var startAngle = i * 60;
          orbitTl.to(dot, {
            duration: 3 + i * 0.4, ease: "none", repeat: 4,
            motionPath: {
              path: [{x: 0, y: 0}],
              align: "self",
            },
            onUpdate: function () {
              var progress = this.progress();
              var angle = (startAngle + progress * 360) * Math.PI / 180;
              gsap.set(dot, {
                x: Math.cos(angle) * radii[i],
                y: Math.sin(angle) * radii[i] * 0.5,
              });
            }
          }, 0);
        });
        tl.add(orbitTl, 0.8);
        gsap.to(sel + ' .label-glow', { scale: 1.2, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 7 });

        // Code lines stagger in
        var lines = document.querySelectorAll(sel + ' .code-line');
        lines.forEach(function (line, i) {
          tl.to(line, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, 0.6 + i * 0.08);
        });

        // Highlight band on lines 7-8 (the key decision)
        tl.set(sel + ' .hl-band', { top: (6 * 36 + 32) + 'px', height: (2 * 36) + 'px' }, 2.5);
        tl.to(sel + ' .hl-band', { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.5);

        // Signal card
        tl.to(sel + ' .signal-card', { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.0);

        // Insight
        tl.to(sel + ' .insight-card', { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.8);
        tl.to(sel + ' .accent-rule', { scaleX: 1, duration: 1, ease: "power2.out" }, 3.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-loop"] = tl;
      })();
    </script>
  </div>
</template>
