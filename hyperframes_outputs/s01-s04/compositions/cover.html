<template id="cover-template">
  <div
    data-composition-id="cover"
    data-width="1920"
    data-height="1080"
    data-duration="6"
  >
    <div class="canvas">
      <div class="dot-grid"></div>
      <div class="glow glow-purple"></div>

      <!-- Central loop symbol -->
      <div class="loop-symbol">
        <svg
          viewBox="0 0 200 200"
          width="200"
          height="200"
        >
          <circle
            class="loop-circle"
            cx="100"
            cy="100"
            r="70"
            fill="none"
            stroke="#A259FF"
            stroke-width="3"
          />
          <polygon
            class="loop-arrow"
            points="170,100 155,90 155,110"
            fill="#A259FF"
          />
        </svg>
      </div>

      <!-- Title -->
      <div class="title-group">
        <div class="title-line title-main">一个循环</div>
        <div class="title-line title-sub">四次叠加</div>
      </div>

      <!-- Subtitle -->
      <div class="subtitle">Agent 架构解析 · s01–s04</div>

      <!-- Bottom tags -->
      <div class="meta-bar">
        <span
          class="meta-chapter"
          data-color="#F24E1E"
          >Loop</span
        >
        <span class="meta-arrow">→</span>
        <span
          class="meta-chapter"
          data-color="#A259FF"
          >Tools</span
        >
        <span class="meta-arrow">→</span>
        <span
          class="meta-chapter"
          data-color="#1ABCFE"
          >Permission</span
        >
        <span class="meta-arrow">→</span>
        <span
          class="meta-chapter"
          data-color="#0ACF83"
          >Hooks</span
        >
      </div>

      <div class="reg-mark reg-tl">+</div>
      <div class="reg-mark reg-br">+</div>
    </div>

    <style>
      [data-composition-id='cover'] {
        width: 1920px;
        height: 1080px;
        position: absolute;
        overflow: hidden;
        background: #0a0a0f;
        color: white;
        font-family: 'Inter', sans-serif;
      }
      [data-composition-id='cover'] .canvas {
        position: absolute;
        inset: 0;
      }
      [data-composition-id='cover'] .dot-grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.04) 1px,
          transparent 1px
        );
        background-size: 32px 32px;
      }
      [data-composition-id='cover'] .glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(120px);
        opacity: 0;
      }
      [data-composition-id='cover'] .glow-purple {
        width: 600px;
        height: 600px;
        background: #a259ff;
        left: 660px;
        top: 240px;
      }
      /* Loop symbol */
      [data-composition-id='cover'] .loop-symbol {
        position: absolute;
        left: 860px;
        top: 180px;
        width: 200px;
        height: 200px;
        opacity: 0;
      }
      [data-composition-id='cover'] .loop-circle {
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        transform-origin: center;
      }
      [data-composition-id='cover'] .loop-arrow {
        opacity: 0;
      }
      /* Title */
      [data-composition-id='cover'] .title-group {
        position: absolute;
        left: 0;
        right: 0;
        top: 430px;
        text-align: center;
      }
      [data-composition-id='cover'] .title-line {
        font-size: 100px;
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.1;
        opacity: 0;
        transform: translateY(30px);
      }
      [data-composition-id='cover'] .title-main {
        color: white;
      }
      [data-composition-id='cover'] .title-sub {
        color: #a259ff;
      }
      [data-composition-id='cover'] .subtitle {
        position: absolute;
        left: 0;
        right: 0;
        top: 680px;
        text-align: center;
        font-size: 26px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.35);
        letter-spacing: 0.05em;
        opacity: 0;
      }
      /* Meta bar */
      [data-composition-id='cover'] .meta-bar {
        position: absolute;
        bottom: 120px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        align-items: center;
        opacity: 0;
      }
      [data-composition-id='cover'] .meta-chapter {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 8px 20px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.5);
      }
      [data-composition-id='cover'] .meta-arrow {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.15);
      }
      /* Reg marks */
      [data-composition-id='cover'] .reg-mark {
        position: absolute;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.08);
      }
      [data-composition-id='cover'] .reg-tl {
        top: 20px;
        left: 20px;
      }
      [data-composition-id='cover'] .reg-br {
        bottom: 20px;
        right: 20px;
      }
    </style>

    <script>
      ;(function () {
        var tl = gsap.timeline({ paused: true })
        var sel = '[data-composition-id="cover"]'

        // Glow
        tl.to(
          sel + ' .glow-purple',
          { opacity: 0.12, duration: 1.2, ease: 'power2.out' },
          0,
        )

        // Loop symbol: circle draws, then arrow appears
        tl.to(sel + ' .loop-symbol', { opacity: 1, duration: 0.3 }, 0.2)
        tl.to(
          sel + ' .loop-circle',
          { strokeDashoffset: 0, duration: 1.2, ease: 'power1.inOut' },
          0.3,
        )
        tl.to(sel + ' .loop-arrow', { opacity: 1, duration: 0.3 }, 1.3)
        // Loop rotates slowly
        tl.to(
          sel + ' .loop-symbol',
          { rotation: 360, duration: 6, ease: 'none', repeat: 0 },
          0.3,
        )

        // Title lines
        tl.to(
          sel + ' .title-main',
          { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' },
          1.6,
        )
        tl.to(
          sel + ' .title-sub',
          { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' },
          1.9,
        )

        // Subtitle
        tl.to(
          sel + ' .subtitle',
          { opacity: 1, duration: 0.5, ease: 'power2.out' },
          2.4,
        )

        // Meta bar — chapters appear with color tint
        tl.to(sel + ' .meta-bar', { opacity: 1, duration: 0.4 }, 2.8)
        var chapters = sel + ' .meta-chapter'
        tl.to(
          chapters,
          {
            stagger: 0.12,
            duration: 0.3,
            ease: 'power2.out',
            onStart: function () {
              document.querySelectorAll(chapters).forEach(function (el) {
                el.style.color = el.dataset.color
                el.style.borderColor = el.dataset.color
                  .replace(')', ',0.3)')
                  .replace('rgb', 'rgba')
              })
            },
          },
          2.8,
        )

        window.__timelines = window.__timelines || {}
        window.__timelines['cover'] = tl
      })()
    </script>
  </div>
</template>
