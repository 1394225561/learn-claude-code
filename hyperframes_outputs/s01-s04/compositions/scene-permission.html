<template id="scene-permission-template">
  <div data-composition-id="scene-permission" data-width="1920" data-height="1080" data-duration="18">
    <div class="canvas">
      <div class="dot-grid"></div>
      <div class="glow glow-blue"></div>

      <div class="section-label">
        <span class="label-id">03 · Permission</span><span class="label-phrase">执行前的一道门</span>
        <div class="label-fx">
          <div class="label-glow"></div>
          <div class="label-dot dot-1"></div>
          <div class="label-dot dot-2"></div>
          <div class="label-dot dot-3"></div>
          <div class="label-dot dot-4"></div>
          <div class="label-dot dot-5"></div>
          <div class="label-dot dot-6"></div>
        </div>
      </div>
      <div class="scene-title">在执行前加一道门，循环一行没改。</div>

      <!-- Code block -->
      <div class="code-block">
        <div class="code-lines">
          <div class="code-line dim" data-line="1"><span class="ln">1</span><span class="kw">def</span> <span class="fn">agent_loop</span>(messages):</div>
          <div class="code-line dim" data-line="2"><span class="ln">2</span>    <span class="kw">while</span> <span class="kc">True</span>:</div>
          <div class="code-line dim" data-line="3"><span class="ln">3</span>        response = client.messages.create(</div>
          <div class="code-line dim" data-line="4"><span class="ln">4</span>            model=MODEL, messages=messages, tools=TOOLS)</div>
          <div class="code-line dim" data-line="5"><span class="ln">5</span>        messages.append({<span class="st">"role"</span>: <span class="st">"assistant"</span>, ...})</div>
          <div class="code-line dim" data-line="6"><span class="ln">6</span></div>
          <div class="code-line dim" data-line="7"><span class="ln">7</span>        <span class="kw">if</span> response.stop_reason != <span class="st">"tool_use"</span>:</div>
          <div class="code-line dim" data-line="8"><span class="ln">8</span>            <span class="kw">return</span></div>
          <div class="code-line dim" data-line="9"><span class="ln">9</span></div>
          <div class="code-line dim" data-line="10"><span class="ln">10</span>        results = []</div>
          <div class="code-line dim" data-line="11"><span class="ln">11</span>        <span class="kw">for</span> block <span class="kw">in</span> response.content:</div>
          <div class="code-line dim" data-line="12"><span class="ln">12</span>            <span class="kw">if</span> block.type == <span class="st">"tool_use"</span>:</div>
          <!-- NEW: permission gate inserted -->
          <div class="code-line new-line" data-line="13"><span class="ln">13</span>                <span class="kw">if not</span> <span class="fn">check_permission</span>(block):</div>
          <div class="code-line new-line" data-line="14"><span class="ln">14</span>                    <span class="kw">continue</span></div>
          <!-- Unchanged execution line -->
          <div class="code-line dim" data-line="15"><span class="ln">15</span>                output = <span class="fn">TOOL_HANDLERS</span>[block.name](**block.input)</div>
          <div class="code-line dim" data-line="16"><span class="ln">16</span>                results.append({<span class="st">"type"</span>: <span class="st">"tool_result"</span>, ...})</div>
          <div class="code-line dim" data-line="17"><span class="ln">17</span>        messages.append({<span class="st">"role"</span>: <span class="st">"user"</span>, <span class="st">"content"</span>: results})</div>
        </div>
      </div>

      <!-- Three gates card -->
      <div class="gates-card" id="gates-card">
        <div class="gates-title">check_permission()</div>
        <div class="gates-stack">
          <div class="gate-row gate-1">
            <span class="gate-num">1</span>
            <span class="gate-name">硬拒绝</span>
            <span class="gate-desc">rm -rf /, sudo → 直接拦截</span>
          </div>
          <div class="gate-arrow">↓</div>
          <div class="gate-row gate-2">
            <span class="gate-num">2</span>
            <span class="gate-name">规则匹配</span>
            <span class="gate-desc">写工作区外？危险命令？</span>
          </div>
          <div class="gate-arrow">↓</div>
          <div class="gate-row gate-3">
            <span class="gate-num">3</span>
            <span class="gate-name">用户确认</span>
            <span class="gate-desc">Allow? [y/N]</span>
          </div>
        </div>
        <div class="gate-note">三道都没命中 → 直接执行</div>
      </div>

      <!-- Insight -->
      <div class="insight-card" id="insight-perm">
        <div class="insight-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1ABCFE" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <div class="insight-text">安全不能靠信任模型，要靠代码。三道闸门串在工具执行前面。</div>
      </div>

      <div class="accent-rule"></div>
    </div>

    <style>

      [data-composition-id="scene-permission"] .dot-grid {

      [data-composition-id="scene-permission"] .glow {
        position: absolute; border-radius: 50%; pointer-events: none;

      [data-composition-id="scene-permission"] .glow-blue {
        width: 500px; height: 500px; background: #1ABCFE;
        left: 600px; top: 100px;
      }
      [data-composition-id="scene-permission"] .section-label {
        position: absolute; top: 50px; left: 80px;
        display: flex; align-items: center; gap: 16px;
        opacity: 0;
      }
      [data-composition-id="scene-permission"] .label-id {
        font-family: "JetBrains Mono", monospace;

      }
      [data-composition-id="scene-permission"] .label-phrase {
        font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.85);

        position: absolute; left: 120px; top: 50%;

        position: absolute; width: 260px; height: 50px;
        left: -130px; top: -25px; border-radius: 25px;
        background: radial-gradient(ellipse, rgba(26,188,254,0.15) 0%, transparent 70%);
        opacity: 0;
      }
      [data-composition-id="scene-permission"] .label-dot {
        position: absolute; width: 5px; height: 5px;
        border-radius: 50%; background: #1ABCFE;
        box-shadow: 0 0 8px rgba(26,188,254,0.6);
        opacity: 0;
      }
      [data-composition-id="scene-permission"] .scene-title {

        opacity: 0; transform: translateY(10px);
      }
      /* Code block */
      [data-composition-id="scene-permission"] .code-block {

      }

        opacity: 0; transform: translateX(-10px);

        padding-left: 5px;
      }
      [data-composition-id="scene-permission"] .ln {

      [data-composition-id="scene-permission"] .st { color: #CE9178; }
      /* Gates card */
      [data-composition-id="scene-permission"] .gates-card {
        position: absolute; right: 80px; top: 180px;
        background: rgba(26,188,254,0.04);
        border: 1px solid rgba(26,188,254,0.15);
        border-radius: 16px; padding: 32px 36px;
        opacity: 0; transform: translateX(20px);
      }
      [data-composition-id="scene-permission"] .gates-title {
        font-family: "JetBrains Mono", monospace;

      }
      [data-composition-id="scene-permission"] .gates-stack {
        display: flex; flex-direction: column; align-items: center; gap: 4px;

        width: 32px; height: 32px; border-radius: 9px;

        border: 1px solid rgba(26,188,254,0.25);

      }
      [data-composition-id="scene-permission"] .gate-name {
        font-size: 20px; font-weight: 600; color: white;
        flex-shrink: 0; width: 80px;
      }
      [data-composition-id="scene-permission"] .gate-desc {
        font-size: 17px; color: rgba(255,255,255,0.35);

      [data-composition-id="scene-permission"] .gate-arrow {

      /* Insight */
      [data-composition-id="scene-permission"] .insight-card {
        position: absolute; left: 80px; bottom: 90px;
        display: flex; align-items: center; gap: 16px;

      [data-composition-id="scene-permission"] .insight-icon {
        width: 40px; height: 40px; border-radius: 10px;

      [data-composition-id="scene-permission"] .accent-rule {
        position: absolute; bottom: 50px; left: 80px; right: 80px;

        transform: scaleX(0); transform-origin: left;
      }
    </style>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var sel = '[data-composition-id="scene-permission"]';

        tl.to(sel + ' .glow-blue', { opacity: 0.06, duration: 1, ease: "power2.out" }, 0);
        tl.to(sel + ' .section-label', { opacity: 1, duration: 0.2 }, 0);
        tl.to(sel + ' .label-id', { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
        tl.fromTo(sel + ' .label-phrase', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(2)" }, 0.3);
        tl.to(sel + ' .scene-title', { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5);

        // Label particle ring
        tl.to(sel + ' .label-glow', { opacity: 1, duration: 0.6 }, 0.5);
        tl.to(sel + ' .label-dot', { opacity: 0.9, duration: 0.3, stagger: 0.08 }, 0.6);
        var orbitTl = gsap.timeline({ repeat: 5 });
        var dots = document.querySelectorAll(sel + ' .label-dot');
        var radii = [30, 40, 50, 35, 45, 38];
        dots.forEach(function (dot, i) {
          var startAngle = i * 60;
          orbitTl.to(dot, {
            duration: 3 + i * 0.4, ease: "none", repeat: 5,
            onUpdate: function () {
              var progress = this.progress();
              var angle = (startAngle + progress * 360) * Math.PI / 180;
              gsap.set(dot, { x: Math.cos(angle) * radii[i], y: Math.sin(angle) * radii[i] * 0.5 });
            }
          }, 0);
        });
        tl.add(orbitTl, 0.8);
        gsap.to(sel + ' .label-glow', { scale: 1.2, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 8 });

        // Dim lines
        tl.to(sel + ' .code-line.dim', { opacity: 0.25, x: 0, duration: 0.3, stagger: 0.04 }, 0.6);

        // New lines (permission gate) — the highlight
        tl.to(sel + ' .code-line.new-line', { opacity: 1, x: 0, duration: 0.5, ease: "back.out(2)", stagger: 0.1 }, 2.5);

        // Pulse
        tl.to(sel + ' .new-line', { boxShadow: '0 0 30px rgba(26,188,254,0.2)', duration: 0.3 }, 3.2);
        tl.to(sel + ' .new-line', { boxShadow: '0 0 0px rgba(26,188,254,0)', duration: 0.5 }, 3.5);

        // Gates card
        tl.to(sel + ' .gates-card', { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.8);
        tl.to(sel + ' .gate-row', { opacity: 1, x: 0, duration: 0.3, stagger: 0.2, ease: "power2.out" }, 4.3);

        // Insight
        tl.to(sel + ' .insight-card', { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.5);
        tl.to(sel + ' .accent-rule', { scaleX: 1, duration: 1, ease: "power2.out" }, 5.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-permission"] = tl;
      })();
    </script>
  </div>
</template>
